version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: streamlocal-postgres
    environment:
      POSTGRES_DB: streamlocal
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: streamlocal-cdn
    ports:
      - "8080:8080"
    # ⚠️ volume relativo subindo 2 níveis até a raiz
    volumes:
      - ../../apps/server/mnt/data/media/chunks:/app/apps/server/mnt/data/media/chunks
      - ../../docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped

volumes:
  pg_data:
