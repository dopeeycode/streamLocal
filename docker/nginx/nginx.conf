events {}

http {
  # Incluir tipos MIME
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 8080;

    # Pasta de onde o Nginx vai servir os chunks
    location /cdn/media/ {
      alias /app/apps/server/mnt/data/media/chunks/;
      
      # Headers CORS
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
      add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control';
      add_header Access-Control-Max-Age 1728000;
      
      # Responder a OPTIONS requests
      if ($request_method = 'OPTIONS') {
        return 204;
      }

      # Configurações específicas para arquivos de áudio
      location ~* \.(m4a|mp3|mp4|aac|ogg|wav|flac)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
      }

      # Configurações para manifests HLS
      location ~* \.(m3u8|ts)$ {
        expires 1m;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
      }
      
      autoindex on;
    }

    # Rota pra testar se o servidor tá online
    location / {
      return 200 "StreamLocal CDN ativo 🚀\n";
      add_header Content-Type text/plain;
    }
  }
}
